background {
    monitor =
    path = ~/Pictures/wallpapers/wallpaper.jpg
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(138, 180, 248, 1)
    inner_color = rgba(20, 20, 25, 0.9)
    font_color = rgba(224, 224, 224, 1)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password...</span>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(224, 224, 224, 1)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}
