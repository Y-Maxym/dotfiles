# Generated by matugen from .config/matugen/templates/yazi-flavor.toml, do not edit by hand
# Only overrides are listed here, everything else comes from the built-in theme.
# Note: [app] overall.bg is intentionally not set, so kitty transparency stays.

[mgr]
# Current path shown at the top
cwd           = { fg = "{{colors.primary.default.hex}}" }

# Find (key /): matched part of the name, position among all matches
find_keyword  = { fg = "{{colors.yellow_source.default.hex}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{colors.purple_source.default.hex}}", bold = true, italic = true }

# Markers: colored bar left of a row (fg = bg gives a solid bar)
marker_selected = { fg = "{{colors.yellow_source.default.hex}}", bg = "{{colors.yellow_source.default.hex}}" }
marker_copied   = { fg = "{{colors.green_source.default.hex}}", bg = "{{colors.green_source.default.hex}}" }
marker_cut      = { fg = "{{colors.red_source.default.hex}}", bg = "{{colors.red_source.default.hex}}" }
marker_marked   = { fg = "{{colors.purple_source.default.hex}}", bg = "{{colors.purple_source.default.hex}}" }

# Counters of selected / copied / cut files
count_selected = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.yellow_source.default.hex}}" }
count_copied   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.green_source.default.hex}}" }
count_cut      = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.red_source.default.hex}}" }

# Vertical lines between the three panels
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

[tabs]
# Tab bar (shown only with two or more tabs). Real bg colors, not "reset"
active   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[mode]
# Mode pill in the status bar: main = bright part, alt = secondary part.
# Both need real colors (not "reset"): the rounded ends are drawn with them.
# Normal mode
normal_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
# Select mode (visual selection, key v)
select_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.yellow_source.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.yellow_source.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
# Unset mode (visual deselection, key V)
unset_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.red_source.default.hex}}", bold = true }
unset_alt  = { fg = "{{colors.red_source.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[indicator]
# Highlighted (hovered) row: `reversed` swaps text and background, so the bar
# takes the color of the file type. Bold marks the active (middle) panel.
parent  = { reversed = true }
current = { reversed = true, bold = true }

[status]
# Permissions on the right: d/-/l type, r read, w write, x execute
perm_sep   = { fg = "{{colors.outline_variant.default.hex}}" }
perm_type  = { fg = "{{colors.green_source.default.hex}}" }
perm_read  = { fg = "{{colors.yellow_source.default.hex}}" }
perm_write = { fg = "{{colors.red_source.default.hex}}" }
perm_exec  = { fg = "{{colors.cyan_source.default.hex}}" }
# Progress bar of copy/move tasks
progress_normal = { fg = "{{colors.green_source.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error  = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.red_source.default.hex}}" }

[which]
# Key hints after the first key of a chord (try pressing g and waiting)
border          = { fg = "{{colors.primary.default.hex}}" }
cand            = { fg = "{{colors.cyan_source.default.hex}}" }
rest            = { fg = "{{colors.outline_variant.default.hex}}" }
desc            = { fg = "{{colors.purple_source.default.hex}}" }
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }

[confirm]
# Confirmation dialogs: trash (d), delete (D), overwrite, quit with running tasks
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}" }
btn_yes = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
btn_no  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[spot]
# File info table (key Tab)
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}" }
tbl_col  = { fg = "{{colors.primary.default.hex}}" }
tbl_cell = { fg = "{{colors.yellow_source.default.hex}}", reversed = true }

[notify]
# Notification popups: info / warning / error titles
title_info  = { fg = "{{colors.green_source.default.hex}}" }
title_warn  = { fg = "{{colors.yellow_source.default.hex}}" }
title_error = { fg = "{{colors.red_source.default.hex}}" }

[pick]
# "Open with" menu (key O)
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.purple_source.default.hex}}", bold = true }

[input]
# Input popups: create (a), rename (r), filter (f), find (/), shell (;)
border = { fg = "{{colors.primary.default.hex}}" }
title  = { fg = "{{colors.primary.default.hex}}" }

[cmp]
# Path completion popup inside inputs (Tab)
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.purple_source.default.hex}}", bold = true }

[tasks]
# Task manager (key w)
border  = { fg = "{{colors.primary.default.hex}}" }
hovered = { fg = "{{colors.purple_source.default.hex}}", bold = true }

[help]
# Key bindings help (key F1)
border = { fg = "{{colors.primary.default.hex}}" }
chord  = { fg = "{{colors.cyan_source.default.hex}}" }

[filetype]
# Replaces the whole built-in rule list, so every rule is repeated here with
# palette colors. Rules are checked top to bottom, the first match wins.
rules = [
	# Image
	{ mime = "**/image/*", fg = "{{colors.yellow_source.default.hex}}" },
	# Media
	{ mime = "**/{audio,video}/*", fg = "{{colors.purple_source.default.hex}}" },
	# Archive
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.red_source.default.hex}}" },
	# Document
	{ mime = "**/application/{pdf,doc,rtf}", fg = "{{colors.cyan_source.default.hex}}" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "{{colors.outline_variant.default.hex}}" },
	# Special file
	{ url = "*", is = "orphan", bg = "{{colors.red_source.default.hex}}" },
	{ url = "*", is = "exec"  , fg = "{{colors.green_source.default.hex}}" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "{{colors.red_source.default.hex}}" },
	{ url = "*/", is = "dummy", bg = "{{colors.red_source.default.hex}}" },
	# Fallback: directories
	{ url = "*/", fg = "{{colors.primary.default.hex}}" }
]

[icon]
# Icons have their own colors, separate from [filetype]. Priority when picking
# an icon: globs > dirs > files > exts > conds. Only the generic folder icon is
# recolored here (conds); language icons keep their built-in colors.
# \uf07b = closed folder, \uf07c = open folder (hovered)
prepend_conds = [
	{ if = "dir & hovered", text = "\uf07c", fg = "{{colors.primary.default.hex}}" },
	{ if = "dir",           text = "\uf07b", fg = "{{colors.primary.default.hex}}" },
]

[git]
# git.yazi: colors of the status signs next to files
unknown   = { fg = "{{colors.outline_variant.default.hex}}" }
ignored   = { fg = "{{colors.outline_variant.default.hex}}" }
untracked = { fg = "{{colors.purple_source.default.hex}}" }
unstaged  = { fg = "{{colors.yellow_source.default.hex}}" }
staged    = { fg = "{{colors.green_source.default.hex}}" }
added     = { fg = "{{colors.green_source.default.hex}}" }
deleted   = { fg = "{{colors.red_source.default.hex}}" }
updated   = { fg = "{{colors.cyan_source.default.hex}}" }
clean     = { fg = "{{colors.outline_variant.default.hex}}" }
