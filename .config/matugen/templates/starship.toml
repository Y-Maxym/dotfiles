# Generated by matugen from .config/matugen/templates/starship.toml, do not edit by hand
add_newline = false

format = "$directory$git_branch$character"

palette = "matugen"

[palettes.matugen]
mg_accent = "{{colors.primary.default.hex}}"
mg_branch = "{{colors.tertiary.default.hex}}"
mg_text = "{{colors.on_surface.default.hex}}"
mg_error = "{{colors.red_source.default.hex}}"

[character]
success_symbol = "[\uf105](bold mg_text)"
error_symbol = "[\uf105](bold mg_error)"

[directory]
style = "bold mg_accent"
truncation_length = 2
truncate_to_repo = false

[git_branch]
format = '[‹](dimmed mg_accent)[$branch](bold mg_branch)[›](dimmed mg_accent) '
truncation_length = 20
truncation_symbol = "…"
