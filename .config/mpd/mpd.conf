# Library: where mpd looks for music. auto_update re-scans the folder
# on its own, so new files (e.g. from yt-dlp) show up without a manual update
music_directory    "~/Music"
auto_update        "yes"

# Daemon data (not settings): track database, saved state, playlists.
# Kept in ~/.local/state, outside dotfiles
db_file            "~/.local/state/mpd/database"
state_file         "~/.local/state/mpd/state"
playlist_directory "~/.local/state/mpd/playlists"

# Control socket: clients (rmpc, mpc) talk to mpd here, local machine only
bind_to_address    "127.0.0.1"
port               "6600"

# Sound goes through PipeWire, same as the rest of the system
audio_output {
    type "pipewire"
    name "PipeWire"
}
