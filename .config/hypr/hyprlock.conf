# Fallback colors (used when matugen is disabled)
$mg_accent = rgba(138, 180, 248, 1)
$mg_text = rgba(224, 224, 224, 1)
$mg_date = rgba(224, 224, 224, 0.8)
$mg_user = rgba(224, 224, 224, 0.6)
$mg_field = rgba(20, 20, 25, 0.9)
$mg_fail = rgba(242, 80, 80, 1)
$mg_caps = rgba(250, 189, 47, 1)
$mg_wallpaper = ~/Pictures/wallpapers/wallpaper.jpg

# Colors generated by matugen (overrides the fallbacks above; comment out this line to disable)
source = ~/.config/matugen/generated/hyprlock-colors.conf

background {
    monitor =
    path = $mg_wallpaper
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $mg_accent
    inner_color = $mg_field
    font_color = $mg_text
    fail_color = $mg_fail
    capslock_color = $mg_caps
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Password...</span>
    fail_text = <i>$FAIL</i>
    fail_timeout = 2000
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $mg_accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $mg_date
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $mg_text
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $mg_user
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
